<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CROSSFIT CUP MASSA - CYBER ARENA LEADERBOARD</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #05070a; color: #f3f4f6; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(0, 229, 255, 0.2); }
        .glow-cyber { box-shadow: 0 0 35px rgba(0, 229, 255, 0.25); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-center pb-6 mb-8 border-b border-cyan-500/30 gap-4">
        <div>
            <h1 class="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-red-500 tracking-wider">
                ⚡ CROSSFIT CUP MASSA ⚡
            </h1>
            <p class="text-cyan-300/70 text-sm md:text-base mt-1">Cyber Arena Live Leaderboard & Giudici in Tempo Reale</p>
        </div>
        <div class="flex items-center gap-3 glass px-4 py-2 rounded-full border-cyan-500/40">
            <span id="conn-dot" class="w-3 h-3 rounded-full bg-yellow-500 animate-pulse"></span>
            <span id="conn-text" class="text-sm font-bold text-yellow-400">CONNESSIONE...</span>
        </div>
    </header>

    <!-- WOD Selector Tabs -->
    <div class="mb-8">
        <h3 class="text-lg font-bold text-cyan-400 mb-3">Seleziona WOD:</h3>
        <div id="wod-tabs" class="flex flex-wrap gap-2"></div>
    </div>

    <!-- Unified Cyber Arena Container (Chart Only) -->
    <div class="glass rounded-3xl p-6 md:p-8 glow-cyber mb-8 border border-cyan-500/40">
        <div class="flex justify-between items-center mb-6 border-b border-cyan-500/20 pb-4">
            <div>
                <h3 id="current-wod-title" class="text-2xl md:text-3xl font-black text-cyan-400">WOD 1 - Cyber Arena</h3>
                <p id="current-wod-badge" class="text-xs text-cyan-300/80 font-semibold mt-1">Sviluppo Reps in Tempo Reale</p>
            </div>
        </div>
        <div class="relative w-full" style="height: 550px;">
            <canvas id="scoreChart"></canvas>
        </div>
    </div>

    <!-- Judges Status Section -->
    <div class="glass rounded-2xl p-6 border-cyan-500/30">
        <h3 class="text-xl font-bold text-cyan-300 mb-4 border-b border-cyan-500/20 pb-3">📋 Stato Giudici in Diretta</h3>
        <div id="judges-grid" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-4"></div>
    </div>

    <!-- Footer -->
    <footer class="mt-12 text-center text-cyan-500/50 text-sm">
        CrossFit Cup Massa Cyber Arena &bull; Sincronizzato con Firebase Realtime Database
    </footer>

    <script>
        let workingDbUrl = null;
        let activeWod = "WOD 1";
        let allWodsData = {};
        let judgesData = {};
        const teamColors = ['#00e5ff', '#ff5722', '#00e676', '#e040fb', '#ffeb3b', '#2196f3', '#e91e63', '#9c27b0'];

        const insideBarPlugin = {
            id: 'insideBar',
            afterDatasetsDraw(chart) {
                const { ctx } = chart;
                chart.data.datasets.forEach((dataset, i) => {
                    const meta = chart.getDatasetMeta(i);
                    meta.data.forEach((bar, index) => {
                        const value = dataset.data[index];
                        const label = chart.data.labels[index];
                        if (value !== undefined && value !== null) {
                            const barY = bar.y;
                            const barBase = bar.base;
                            const barHeight = Math.abs(barBase - barY);
                            const centerX = bar.x;
                            const centerY = (barY + barBase) / 2;

                            ctx.save();
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';

                            if (barHeight > 60) {
                                // Draw rep count (doubled size: 96px bold black)
                                ctx.fillStyle = '#000000';
                                ctx.font = '900 96px Montserrat';
                                ctx.fillText(value, centerX, centerY - 35);

                                // Draw team name always visible below rep count (doubled size: 40px bold dark)
                                ctx.fillStyle = '#0a0a0a';
                                ctx.font = '700 40px Montserrat';
                                ctx.fillText(label, centerX, centerY + 45);
                            } else {
                                // If bar is short, draw above bar
                                ctx.fillStyle = '#00ffff';
                                ctx.font = 'bold 20px Montserrat';
                                ctx.textBaseline = 'bottom';
                                ctx.fillText(`${label}: ${value}`, centerX, barY - 10);
                            }
                            ctx.restore();
                        }
                    });
                });
            }
        };

        const ctx = document.getElementById('scoreChart').getContext('2d');
        const scoreChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: [],
                datasets: [{
                    label: 'Reps / Progresso',
                    data: [],
                    backgroundColor: function(context) {
                        const chart = context.chart;
                        const {ctx, chartArea} = chart;
                        if (!chartArea) return 'rgba(0, 229, 255, 0.5)';
                        const gradient = ctx.createLinearGradient(0, chartArea.bottom, 0, chartArea.top);
                        gradient.addColorStop(0, 'rgba(0, 229, 255, 0.4)');
                        gradient.addColorStop(1, 'rgba(0, 229, 255, 0.85)');
                        return gradient;
                    },
                    borderColor: '#00ffff',
                    borderWidth: 2,
                    borderRadius: 10
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: { color: '#00e5ff', font: { weight: 'bold', size: 14 } },
                        grid: { color: 'rgba(0, 229, 255, 0.1)' }
                    },
                    x: {
                        display: false,
                        grid: { display: false }
                    }
                },
                plugins: { legend: { display: false } }
            },
            plugins: [insideBarPlugin]
        });

        function initWodTabs() {
            const container = document.getElementById('wod-tabs');
            container.innerHTML = '';
            for (let i = 1; i <= 12; i++) {
                const wodName = `WOD ${i}`;
                const btn = document.createElement('button');
                btn.className = `px-4 py-2 rounded-xl font-bold text-sm transition-all ${activeWod === wodName ? 'bg-gradient-to-r from-cyan-500 to-blue-600 text-white shadow-lg shadow-cyan-500/50 scale-105 border border-cyan-300' : 'bg-slate-800/80 text-cyan-200 hover:bg-slate-700 border border-cyan-500/20'}`;
                btn.innerText = wodName;
                btn.onclick = () => {
                    activeWod = wodName;
                    initWodTabs();
                    updateUI();
                };
                container.appendChild(btn);
            }

            const genBtn = document.createElement('button');
            genBtn.className = `px-5 py-2 rounded-xl font-black text-sm transition-all ${activeWod === 'GENERAL' ? 'bg-gradient-to-r from-orange-500 to-amber-500 text-white shadow-xl shadow-orange-500/50 scale-105 border border-orange-300' : 'bg-slate-800/80 text-orange-400 hover:bg-slate-700 border border-orange-500/40'}`;
            genBtn.innerText = "🏆 CLASSIFICA GENERALE";
            genBtn.onclick = () => {
                activeWod = 'GENERAL';
                initWodTabs();
                updateUI();
            };
            container.appendChild(genBtn);
        }

        async function resolveWorkingUrl() {
            const candidates = [
                "https://judge-fda21-default-rtdb.firebaseio.com",
                "https://judge-fda21-default-rtdb.europe-west1.firebasedatabase.app",
                "https://judge-fda21-default-rtdb.us-central1.firebasedatabase.app"
            ];
            for (const url of candidates) {
                try {
                    const res = await fetch(`${url}/scores.json`, { method: 'GET' });
                    if (res.ok || res.status === 401 || res.status === 403) return url;
                } catch (e) {}
            }
            return candidates[0];
        }

        async function fetchFirebaseData() {
            try {
                if (!workingDbUrl) workingDbUrl = await resolveWorkingUrl();
                const [wodsRes, scoresRes] = await Promise.all([
                    fetch(`${workingDbUrl}/wods.json`),
                    fetch(`${workingDbUrl}/scores.json`)
                ]);
                if (!wodsRes.ok || !scoresRes.ok) throw new Error("Network error");
                allWodsData = await wodsRes.json() || {};
                const rawScores = await scoresRes.json() || {};

                judgesData = {};
                Object.keys(rawScores).forEach(k => {
                    const s = rawScores[k];
                    if (s && (s.judgeId || s.judgeName)) judgesData[s.judgeName || s.judgeId] = s;
                });

                document.getElementById('conn-dot').className = "w-3 h-3 rounded-full bg-green-500 animate-pulse";
                document.getElementById('conn-text').innerText = "ONLINE (FIREBASE)";
                document.getElementById('conn-text').className = "text-sm font-bold text-green-400";
                updateUI();
            } catch (err) {
                console.error("Firebase fetch error:", err);
                document.getElementById('conn-dot').className = "w-3 h-3 rounded-full bg-red-500";
                document.getElementById('conn-text').innerText = "ERRORE LETTURA";
                document.getElementById('conn-text').className = "text-sm font-bold text-red-400";
            }
        }

        function isTimeWod(wodName) {
            return ['WOD 1', 'WOD 2', 'WOD 3', 'WOD 5', 'WOD 7', 'WOD 9'].includes(wodName);
        }

        function compareForTimeTeams(a, b, wodName) {
            const targets = {
                'WOD 1': 210,
                'WOD 2': 0,
                'WOD 3': 150,
                'WOD 5': 80,
                'WOD 7': 400,
                'WOD 9': 240
            };
            const target = targets[wodName] || 0;

            const aCompleted = target > 0 ? (a.reps >= target || a.score >= target) : (a.timeSeconds > 0);
            const bCompleted = target > 0 ? (b.reps >= target || b.score >= target) : (b.timeSeconds > 0);

            if (aCompleted && !bCompleted) return -1;
            if (!aCompleted && bCompleted) return 1;

            if (aCompleted && bCompleted) {
                const tA = a.timeSeconds > 0 ? a.timeSeconds : 999999;
                const tB = b.timeSeconds > 0 ? b.timeSeconds : 999999;
                return tA - tB;
            } else {
                const rA = a.reps || a.score || 0;
                const rB = b.reps || b.score || 0;
                return rB - rA;
            }
        }

        function getWodPointsMap(wodName, wodTeams) {
            const timeWod = isTimeWod(wodName);
            const entries = Object.keys(wodTeams || {}).map(teamKey => {
                const data = wodTeams[teamKey];
                return {
                    name: teamKey,
                    reps: Number(data.reps || data.score || 0),
                    timeSeconds: Number(data.timeSeconds || 0),
                    wodType: data.wodType || 'REPS',
                    score: Number(data.score || 0),
                    maxLoad: Number(data.maxLoad || 0)
                };
            });

            if (timeWod) {
                entries.sort((a, b) => compareForTimeTeams(a, b, wodName));
            } else {
                entries.sort((a, b) => b.reps - a.reps);
            }

            const pointsMap = {};
            const ptsTable = [5, 4, 3, 2, 1];
            entries.forEach((e, idx) => {
                const p = idx < ptsTable.length ? ptsTable[idx] : 1;
                pointsMap[e.name] = p;
            });
            return pointsMap;
        }

        function updateUI() {
            const chartLabels = [];
            const chartData = [];
            const barColors = [];

            if (activeWod === 'GENERAL') {
                document.getElementById('current-wod-title').innerText = "🏆 CLASSIFICA GENERALE ASSOLUTA";
                document.getElementById('current-wod-badge').innerText = "Punteggio Totale Punti WOD (5-4-3-2-1)";

                const totals = {};
                for (let i = 1; i <= 12; i++) {
                    const wName = `WOD ${i}`;
                    const wodTeams = allWodsData[wName] || {};
                    const ptsMap = getWodPointsMap(wName, wodTeams);
                    Object.keys(ptsMap).forEach(team => {
                        totals[team] = (totals[team] || 0) + ptsMap[team];
                    });
                }

                const sortedTeams = Object.keys(totals).map(t => ({ name: t, total: totals[t] })).sort((a, b) => b.total - a.total);

                sortedTeams.forEach((team, idx) => {
                    chartLabels.push(team.name);
                    chartData.push(team.total);
                    barColors.push(teamColors[idx % teamColors.length]);
                });

                const maxVal = Math.max(...chartData, 10);
                scoreChart.options.scales.y.max = Math.ceil((maxVal * 4 / 3) / 5) * 5;

            } else {
                document.getElementById('current-wod-title').innerText = `${activeWod} - Cyber Arena Live`;
                document.getElementById('current-wod-badge').innerText = isTimeWod(activeWod) ? "Time Cap 8m (Completati per tempo, non completati per rep)" : "Reps / Load";

                const wodTeams = allWodsData[activeWod] || {};
                const timeWod = isTimeWod(activeWod);

                const teamEntries = Object.keys(wodTeams).map(teamKey => {
                    const data = wodTeams[teamKey];
                    return {
                        name: teamKey,
                        reps: Number(data.reps || data.score || 0),
                        timeSeconds: Number(data.timeSeconds || 0),
                        wodType: data.wodType || 'REPS',
                        score: Number(data.score || 0),
                        maxLoad: Number(data.maxLoad || 0),
                        category: data.category || ''
                    };
                });

                if (timeWod) {
                    teamEntries.sort((a, b) => compareForTimeTeams(a, b, activeWod));
                } else {
                    teamEntries.sort((a, b) => b.reps - a.reps);
                }

                teamEntries.forEach((team, idx) => {
                    chartLabels.push(team.name);
                    chartData.push(team.reps);
                    barColors.push(teamColors[idx % teamColors.length]);
                });

                const fixedMaxReps = {
                    'WOD 1': 210,
                    'WOD 2': 2000,
                    'WOD 3': 150,
                    'WOD 5': 80,
                    'WOD 7': 400,
                    'WOD 9': 240
                };
                if (fixedMaxReps[activeWod]) {
                    scoreChart.options.scales.y.max = fixedMaxReps[activeWod];
                } else {
                    const maxRep = Math.max(...chartData, 10);
                    scoreChart.options.scales.y.max = Math.ceil((maxRep * 4 / 3) / 10) * 10;
                }
            }

            scoreChart.data.labels = chartLabels.length ? chartLabels : ['Nessun Team'];
            scoreChart.data.datasets[0].data = chartData.length ? chartData : [0];
            scoreChart.data.datasets[0].backgroundColor = barColors;
            scoreChart.update();

            const judgesGrid = document.getElementById('judges-grid');
            judgesGrid.innerHTML = '';
            const activeJudges = Object.keys(judgesData);
            if (activeJudges.length === 0) {
                judgesGrid.innerHTML = `<p class="text-cyan-300/70 col-span-full text-center py-4">Nessun giudice attivo al momento.</p>`;
            } else {
                activeJudges.forEach(jName => {
                    const jData = judgesData[jName];
                    const jCard = document.createElement('div');
                    jCard.className = `bg-slate-900/90 border border-cyan-500/40 shadow-lg shadow-cyan-500/10 rounded-xl p-3 text-center`;
                    const val = jData.wodType === 'MAX_LOAD' ? `${jData.maxLoad} kg` : (jData.wodType === 'TIME' || jData.wodType === 'ROW' ? `${Math.floor(jData.timeSeconds/60)}m ${jData.timeSeconds%60}s` : `${jData.reps} reps`);
                    jCard.innerHTML = `
                        <div class="text-xs font-bold text-cyan-400 mb-1">GIUDICE: ${jName}</div>
                        <div class="text-sm font-bold text-white truncate">${jData.athleteName}</div>
                        <div class="text-xs text-cyan-300/70 truncate">${jData.wodName}</div>
                        <div class="text-lg font-black text-green-400 mt-1">${val}</div>`;
                    judgesGrid.appendChild(jCard);
                });
            }
        }

        initWodTabs();
        fetchFirebaseData();
        setInterval(fetchFirebaseData, 1000);
    </script>
</body>
</html>
